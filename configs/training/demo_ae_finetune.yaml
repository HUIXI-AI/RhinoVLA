run_id: demo_example_lerobot_v3_bs1_smoke
run_root_dir: outputs/demo_train
run_note: |
  Minimal local smoke for the bundled example LeRobot v3 dataset. This keeps
  the RhinoVLA native72 data/model contract but uses batch size 1 and one optimizer
  step so the full data -> norm -> loader -> forward/backward chain can be
  checked quickly.
seed: 42
trackers: [jsonl]

framework:
  name: RhinoVLA
  qwenvl:
    base_vlm: rhinovla/assets/qwen3_vl_processor
    attn_implementation: sdpa
    freeze_qwen: true
    image_min_pixels: 65536
    image_max_pixels: 65536
  action_expert:
    action_dim: 72
    state_dim: 72
    action_horizon: 30
    width: 1024
    depth: 18
    mlp_dim: 3072
    use_state_token: true
    use_mask_condition: true
    use_adarms: true
    prefix_layer_offset: 10
    init_from_qwen_last_n_layers: false
    qwen_init_adarms_passthrough: true
    qwen_init_adarms_gate_bias: 5.0
    flow_time_convention: rhinovla
    noise_beta_alpha: 1.0
    noise_beta_beta: 1.5
    num_inference_timesteps: 10

datasets:
  vla_data:
    dataset_py: lerobot_native72
    mapping_path: configs/data_mappings/demo_lerobot_native72.yaml
    mapping_dataset_id: example_lerobot_v3
    norm_stats_path: datasets/example_lerobot_v3/meta/norm.json
    per_device_batch_size: 1
    load_all_data_for_training: true
    obs: [head_rgb, left_rgb, right_rgb]
    camera_names: [head_rgb, left_rgb, right_rgb]
    video_backend: pyav
    action_horizon: 30
    state_dim: 72
    image_size: [256, 256]
    pre_resize_images: false
    image_aug_profile: strong_light_safe_color
    num_workers: 0
    persistent_workers: false
    pin_memory: false
    n_eval_batches: 0
    image_resize_mode: letterbox
    # true: RhinoVLA pretrain-style View Registry prompt.
    # false: bare image-image-image + instruction prompt.
    use_view_registry_prompt: true
    view_role_vocab: [side, hand, top_head, hand_left, hand_right, head, head_center, head_left, head_right, head_back, back_left, back_right]
    view_modality_vocab: [rgb, fisheye]
    view_roles: [top_head, hand_left, hand_right]
    view_modalities: [rgb, rgb, rgb]

trainer:
  epochs: 1
  max_train_steps: 1
  num_warmup_steps: 1
  save_interval: 1000
  keep_last_n_checkpoints: 1
  eval_interval: 1000000
  tf_eval_interval: 1000000
  tf_eval_on_start: false
  attention_gif_eval: false
  learning_rate:
    base: 5.12e-5
    action_expert.transformer: 5.12e-5
    action_expert.io: 5.12e-5
  lr_scheduler_type: cosine
  loss_scale: {vla: 1.0, vlm: 0.0}
  repeated_diffusion_steps: 1
  logging_frequency: 1
  gradient_clipping: 0.5
  gradient_accumulation_steps: 1
  optimizer:
    betas: [0.9, 0.95]
    eps: 1.0e-8
    weight_decay: 1.0e-4
  enable_gradient_checkpointing: false
  pretrained_checkpoint: checkpoints/rhinovla_pretrain.ckpt
