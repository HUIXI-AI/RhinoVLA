run_id: demo_full_finetune
run_root_dir: outputs/demo_full_finetune
run_note: |
  Full-finetune recipe using the default dynamic image geometry, compact view
  prompt, corrected multimodal RoPE positions, and OpenPI flow path. Qwen text
  layers and the Action Expert train while the vision encoder stays frozen.
seed: 42
trackers: [jsonl]

framework:
  name: RhinoVLA
  qwenvl:
    base_vlm: rhinovla/assets/qwen3_vl_processor
    attn_implementation: sdpa
    freeze_qwen: false
    freeze_vision: true
    image_min_pixels: 65536
    image_max_pixels: 131072
  action_expert:
    action_dim: 72
    state_dim: 72
    action_horizon: 30
    width: 1024
    depth: 18
    mlp_dim: 3072
    use_state_token: true
    use_mask_condition: true
    use_adarms: true
    prefix_layer_offset: 10
    init_from_qwen_last_n_layers: false
    qwen_init_adarms_passthrough: true
    qwen_init_adarms_gate_bias: 5.0
    num_inference_timesteps: 10

datasets:
  vla_data:
    dataset_py: lerobot_native72
    mapping_path: configs/data_mappings/demo_lerobot_native72.yaml
    mapping_dataset_id: example_lerobot_v3
    norm_stats_path: datasets/example_lerobot_v3/meta/norm.json
    action_type: absolute_joint_position
    per_device_batch_size: 16
    load_all_data_for_training: true
    obs: [head_rgb, left_rgb, right_rgb]
    camera_names: [head_rgb, left_rgb, right_rgb]
    video_backend: pyav
    action_horizon: 30
    state_dim: 72
    image_size: [256, 256]
    image_aug_profile: strong_light_safe_color
    num_workers: 6
    persistent_workers: true
    prefetch_factor: 1
    pin_memory: true
    n_eval_batches: 4
    view_role_vocab: [side, hand, top_head, hand_left, hand_right, head, head_center, head_left, head_right, head_back, back_left, back_right]
    view_modality_vocab: [rgb, fisheye]
    view_roles: [top_head, hand_left, hand_right]
    view_modalities: [rgb, rgb, rgb]

trainer:
  epochs: 1
  max_train_steps: 30000
  num_warmup_steps: 1000
  save_interval: 2000
  keep_last_n_checkpoints: 6
  eval_interval: 1000
  tf_eval_interval: 1000
  tf_eval_on_start: false
  learning_rate:
    base: 2.0e-5
    qwen: 2.0e-5
    action_expert.transformer: 2.0e-5
    action_expert.io: 2.0e-5
  lr_scheduler_type: cosine_with_min_lr
  loss_scale: {vla: 1.0, vlm: 0.0}
  repeated_diffusion_steps: 1
  logging_frequency: 1
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    betas: [0.9, 0.95]
    eps: 1.0e-8
    weight_decay: 1.0e-10
  enable_gradient_checkpointing: false
  pretrained_checkpoint: checkpoints/rhinovla_pretrain.ckpt
  is_resume: false
  scheduler_specific_kwargs:
    min_lr_rate: 0.1
  viz_prompt_num_samples: 5
  viz_tf_error_num_episodes: 5
  viz_attention_num_samples: 5
